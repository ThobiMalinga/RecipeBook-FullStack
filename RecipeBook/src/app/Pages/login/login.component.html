<form
  class="add-recipe-form login-form"
  #f="ngForm"
  (ngSubmit)="onLogin(f)"
  novalidate
  aria-labelledby="loginHeading"
>
  <h3 id="loginHeading">Sign in</h3>

  <!-- Global auth error (e.g., invalid credentials) -->
  <div
    class="auth-error"
    role="alert"
    *ngIf="authError"
    aria-live="assertive"
  >
    {{ authError }}
  </div>

  <!-- Email -->
  <div class="form-field">
    <label for="email">
      Email <span class="required" aria-hidden="true">*</span>
      <span class="visually-hidden">required</span>
    </label>

    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="model.email"
      #email="ngModel"
      required
      email
      autocomplete="email"
      placeholder="you@example.com"
      aria-required="true"
      [attr.aria-invalid]="(email.invalid && (email.touched || f.submitted)) ? 'true' : 'false'"
      [attr.aria-describedby]="(email.invalid && (email.touched || f.submitted)) ? 'emailError' : null"
    />

    <!-- Hints / validation -->
    <small class="hint" id="emailHint">Use your work email</small>

    <small
      id="emailError"
      class="error"
      *ngIf="email.invalid && (email.touched || f.submitted)"
    >
      <ng-container *ngIf="email.errors?.['required']">
        Email is required.
      </ng-container>
      <ng-container *ngIf="email.errors?.['email']">
        Please enter a valid email address.
      </ng-container>
    </small>
  </div>

  <!-- Password -->
  <div class="form-field">
    <label for="password">
      Password <span class="required" aria-hidden="true">*</span>
      <span class="visually-hidden">required</span>
    </label>

    <div class="password-row">
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        name="password"
        [(ngModel)]="model.password"
        #password="ngModel"
        required
        minlength="6"
        autocomplete="current-password"
        placeholder="Enter your password"
        aria-required="true"
        [attr.aria-invalid]="(password.invalid && (password.touched || f.submitted)) ? 'true' : 'false'"
        [attr.aria-describedby]="(password.invalid && (password.touched || f.submitted)) ? 'passwordError' : null"
      />

      <!-- Show/Hide password -->
      <button
        type="button"
        class="toggle-password"
        (click)="showPassword = !showPassword"
        [attr.aria-pressed]="showPassword"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      >
        {{ showPassword ? 'Hide' : 'Show' }}
      </button>
    </div>

    <!-- Hints / validation -->
    <small class="hint">Minimum 6 characters</small>

    <small
      id="passwordError"
      class="error"
      *ngIf="password.invalid && (password.touched || f.submitted)"
    >
      <ng-container *ngIf="password.errors?.['required']">
        Password is required.
      </ng-container>
      <ng-container *ngIf="password.errors?.['minlength']">
        Password must be at least {{ password.errors?.['minlength']?.requiredLength }} characters.
      </ng-container>
    </small>
  </div>

  <!-- Remember me + Forgot password -->
  <div class="form-field remember-forgot">
    <label class="remember">
      <input
        type="checkbox"
        name="rememberMe"
        [(ngModel)]="model.rememberMe"
      />
      Remember me
    </label>

    <a class="forgot-link" href="#" (click)="onForgotPassword($event)">Forgot password?</a>
  </div>

  <!-- Actions -->
  <div class="actions">
    <!-- Left (secondary) -->
    <button
      type="button"
      class="btn-clear"
      (click)="onClear(f)"
      [disabled]="loading"
    >
      Clear
    </button>

    <!-- Right (primary) -->
    <button
      type="submit"
      class="btn-submit"
      [disabled]="loading || f.invalid"
    >
      <ng-container *ngIf="!loading; else loadingTpl">Login</ng-container>
    </button>

    <ng-template #loadingTpl>
      Loading...
    </ng-template>
  </div>

  <!-- Optional bottom helper -->
  <div class="form-field signup-cta">
    <span>Don’t have an account?</span>
    <a class="signup-link" href="#" (click)="onGoToRegister($event)">Create one</a>
  </div>
</form>

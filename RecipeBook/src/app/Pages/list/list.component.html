<h2>Recipes</h2>

<div *ngIf="recipes.length === 0">
  No recipes yet. Add one!
</div>

<div *ngFor="let recipe of recipes" class="recipe-card">
  <h3>{{ recipe.name }}</h3>

  <img *ngIf="recipe.image" [src]="recipe.image" alt="{{ recipe.name }}" />

  <h4>Ingredients</h4>
  <ul>
    <li *ngFor="let ingredient of recipe.ingredients">
      {{ ingredient }}
    </li>
  </ul>

  <h4>Instructions</h4>
  <ol>
    <li *ngFor="let step of recipe.instructions">
      {{ step }}
    </li>
  </ol>
</div>
